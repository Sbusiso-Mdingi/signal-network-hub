name: Publish current React site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "CNAME"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/publish-react-site.mjs"
      - "scripts/enforce-public-domain.mjs"
      - ".github/workflows/publish-current-react-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-current-react-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build current React routes into docs
        run: bun run build:static

      - name: Commit generated Pages output
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ already matches the current React build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "build: publish current React site to Pages"
          git push origin HEAD:main
